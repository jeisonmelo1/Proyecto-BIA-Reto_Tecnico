sonar.projectKey=proyecto-playwright
sonar.projectName=ProyectoPlaywright
sonar.projectVersion=1.0

# Código fuente principal (lógica Screenplay)
sonar.sources=tests/screenplay

# Código de tests (Cucumber steps, support, features)
sonar.tests=tests/cucumber,tests/features

# Archivos a incluir/excluir
sonar.inclusions=tests/**/*.ts
sonar.exclusions=node_modules/**,playwright-report/**,test-results/**,coverage/**

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Cobertura generada por c8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SonarQube server
sonar.host.url=http://localhost:9000

# Token: reemplaza con el tuyo (genera en SonarQube > Account > Security > Tokens)
sonar.token=sqp_22401a1611ab92017db95f0bc750548a83399992
