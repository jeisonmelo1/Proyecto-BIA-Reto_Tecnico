name: E2E · Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Rama, tag o commit de biaenergy/prueba-qa a levantar'
        required: false
        default: 'main'
  schedule:
    - cron: '0 11 * * 1-5' # lunes a viernes, 06:00 hora de Colombia

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_REPO: biaenergy/prueba-qa
  APP_REF: ${{ inputs.app_ref || 'main' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  e2e:
    name: E2E · ${{ matrix.project }}
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, install: chromium }
          - { project: firefox, install: firefox }
          - { project: webkit, install: webkit }
          - { project: chrome, install: chrome }
          - { project: edge, install: msedge }
    env:
      CI: 'true'
      HEADLESS: 'true'
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:8080/api/v1
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Validar secretos
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Define los secretos ADMIN_EMAIL y ADMIN_PASSWORD en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Descargar la aplicación EnergIA
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app

      - name: Levantar EnergIA con Docker Compose
        working-directory: app
        run: |
          cp .env.example .env
          {
            echo "AUTH_EMAIL=$ADMIN_EMAIL"
            echo "AUTH_PASSWORD=$ADMIN_PASSWORD"
            echo "JWT_SECRET=ci-$(openssl rand -hex 16)"
          } >> .env
          docker compose up -d --build

      - name: Esperar a que la UI y la API respondan
        run: |
          for url in http://localhost:8080/docs http://localhost:3000; do
            for i in $(seq 1 60); do
              if curl -fs -o /dev/null "$url"; then echo "OK $url"; break; fi
              if [ "$i" = 60 ]; then echo "::error::$url no respondió"; exit 1; fi
              sleep 2
            done
          done

      - uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependencias
        working-directory: e2e
        run: npm ci

      - name: Instalar navegador (${{ matrix.install }})
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.install }}

      - name: Ejecutar pruebas (${{ matrix.project }})
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.project }}

      - name: Publicar reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar evidencias (trazas, capturas, video)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Logs de la aplicación
        if: ${{ failure() }}
        working-directory: app
        run: docker compose logs --no-color --tail=200

      - name: Detener la aplicación
        if: ${{ always() }}
        working-directory: app
        run: docker compose down -v
